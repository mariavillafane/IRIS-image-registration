#default: run the published image.
#to build and run the LOCAL code instead (e.g. to test fixes), use:
#  docker compose -f compose.yml -f compose.build.yml up
#(see compose.build.yml - it builds this repo into iris:local and persists
#uploads/results in named volumes)
services:
  iris:
    image: mariavillafane/iris:latest
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000