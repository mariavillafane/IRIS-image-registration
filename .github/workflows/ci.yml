name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: iris:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    outputs:
      report-url: ${{ steps.report.outputs.artifact-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install client dependencies
        run: yarn install --frozen-lockfile

      - name: Install server dependencies
        run: yarn install --frozen-lockfile
        working-directory: server

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: yarn e2e

      - name: Upload Playwright HTML report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error

      - name: Upload test results (videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Write run summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## E2E tests: ${{ job.status }}

          [Playwright HTML report artifact](${{ steps.report.outputs.artifact-url }})
          (sign in to GitHub to download; view with \`npx playwright show-report\`)
          EOF

  e2e-report-comment:
    name: Share e2e report on PR
    needs: e2e
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Create or update report comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- iris-e2e-report -->";
            const status = "${{ needs.e2e.result }}";
            const reportUrl = "${{ needs.e2e.outputs.report-url }}";
            const runUrl =
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";

            const icon = status === "success" ? "✅" : "❌";
            const reportLink = reportUrl
              ? `[📊 Playwright HTML report (artifact)](${reportUrl})`
              : `Report artifact unavailable - see the [workflow run](${runUrl})`;

            const body = [
              marker,
              `## ${icon} E2E tests: ${status}`,
              "",
              reportLink,
              "",
              "Sign in to GitHub to download the artifact, unzip it, and view it with `npx playwright show-report <folder>`. The report includes a recorded video of every test.",
              "",
              `Workflow run: ${runUrl}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }